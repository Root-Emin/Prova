appId: com.prova.desktop
productName: Prova
asar: true
npmRebuild: false

directories:
  output: release
  buildResources: build

files:
  - dist-electron/**/*
  - out/**/*
  - package.json
  - "!node_modules/**/*"
  - "!dist-electron/**/*.map"

artifactName: ${productName}-${version}-${os}-${arch}.${ext}

mac:
  category: public.app-category.education
  # Distribution signing is intentionally opt-in until release credentials and
  # notarization are configured. Override this in the release pipeline.
  identity: null
  hardenedRuntime: true
  target:
    - target: dmg
      arch:
        - arm64
        - x64
  extendInfo:
    NSMicrophoneUsageDescription: Prova, sesli rol oyununda konuşmanızı cihazınızda işlemek için mikrofon erişimine ihtiyaç duyar.

win:
  target:
    - target: nsis
      arch:
        - x64

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true

linux:
  category: Education
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
