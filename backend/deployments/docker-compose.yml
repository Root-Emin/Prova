# Local development stack only.
# SECURITY: default credentials are weak; change them before any shared network use.
# Database and cache ports bind to loopback by default (override via *_HOST_BIND env vars).
name: prova

services:
  postgres:
    image: postgres:16-alpine
    container_name: prova-postgres
    environment:
      POSTGRES_USER: masterfabric
      POSTGRES_PASSWORD: masterfabric
      POSTGRES_DB: masterfabric
    ports:
      - "${DB_HOST_BIND:-127.0.0.1}:${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U masterfabric"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: prova-redis
    ports:
      - "${REDIS_HOST_BIND:-127.0.0.1}:${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  mongo:
    image: mongo:7
    container_name: prova-mongo
    environment:
      MONGO_INITDB_DATABASE: prova
    ports:
      - "${MONGO_HOST_BIND:-127.0.0.1}:${MONGO_PORT:-27017}:27017"
    volumes:
      - mongodata:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Mailpit, geliştirmede giden e-postaları yakalar.
  #
  # Parolasız giriş e-postaya bağlı; bir geliştiricinin akışı gerçekten
  # denemesi için iletiyi görmesi gerekiyor. Konsola kod basmak alternatif
  # değildi: konsola basılan kod, log akışındaki bir kimlik bilgisidir ve
  # onu okuyabilen geliştirici teslimin bozulduğunu hiç fark etmez.
  #
  # SMTP 1025, web arayüzü 8025.
  mailpit:
    image: axllent/mailpit:latest
    container_name: prova-mailpit
    ports:
      - "${MAILPIT_SMTP_BIND:-127.0.0.1}:${SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_BIND:-127.0.0.1}:8025:8025"
    environment:
      MP_MAX_MESSAGES: 500
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Kafka Prova'da kullanılmıyor; olay veri yolu süreç içi. Servis, eski
  # kurulumlarla uyum için duruyor ve varsayılan profilde başlatılmıyor.
  kafka:
    profiles: ["kafka"]
    image: apache/kafka:latest
    container_name: prova-kafka
    ports:
      - "${KAFKA_HOST_BIND:-127.0.0.1}:${KAFKA_PORT:-9092}:9092"
    environment:
      # KRaft single-node setup
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 3
      CLUSTER_ID: "MasterfabricKafkaClusterId1"
    volumes:
      - kafkadata:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:29092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  kafka-ui:
    profiles: ["kafka"]
    image: provectuslabs/kafka-ui:latest
    container_name: prova-kafka-ui
    ports:
      - "${KAFKA_UI_HOST_BIND:-127.0.0.1}:8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: prova
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      kafka:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
  mongodata:
  kafkadata:
